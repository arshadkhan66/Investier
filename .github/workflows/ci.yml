name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the light dependencies only; llama-cpp-python is heavy to
          # compile in CI and the platform degrades gracefully without it.
          grep -v llama-cpp-python requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt pytest
      - name: Install browser engine (optional)
        # The browser suite degrades gracefully, but installing Chromium lets
        # CI exercise the real rendering path.
        run: python -m playwright install --with-deps chromium || echo "skipped"
      - name: Run tests
        run: python -m pytest tests/ -q
